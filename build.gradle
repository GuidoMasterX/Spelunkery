plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.11-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "8.3.6" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}


subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "com.github.johnrengelman.shadow"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        mappings loom.layered() {

            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.mod_id
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {

        flatDir {
            dirs 'mods'
        }

        mavenLocal()

        maven { url "https://maven.parchmentmc.org" }

        exclusiveContent {
            forRepository {
                maven {
                    name = "CurseForge"
                    url = "https://www.cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases"
        }
        maven {
            name = "MehVadJukaar"
            url = "https://registry.somethingcatchy.net/repository/maven-releases/"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Gegy"
                    url = "https://maven.gegy.dev"
                }
            }
            filter {
                includeGroupAndSubgroups("dev.lambdaurora")
                includeGroup("io.github.queerbric")
            }
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }

    java {
        withSourcesJar()
    }
}

tasks.register("validateSpelunkeryData") {
    doLast {
        def resources = file("common/src/main/resources")
        def neoforgeResources = file("neoforge/src/main/resources")
        assert !file("${resources}/data/create/recipes").exists(), "Create recipes must use the singular recipe directory"
        assert file("${resources}/data/create/recipe").exists(), "Create recipe directory is missing"
        assert !file("${resources}/data/spelunkery/overrides").exists(), "Dead dynamic override directory must stay deleted"
        assert file("${neoforgeResources}/data/spelunkery/neoforge/biome_modifier/crevice_carver.json").exists(), "Crevice carver modifier is missing"

        fileTree("${resources}/data/create/recipe").matching { include "**/*.json" }.each { recipe ->
            assert !recipe.text.contains("processingTime"), "Create recipe uses stale processingTime: ${recipe}"
            assert !recipe.text.contains('"id": 0.8'), "Create recipe has an invalid numeric id: ${recipe}"
        }

        ["andesite", "diorite", "granite", "tuff"].each { name ->
            def table = file("${resources}/data/spelunkery/loot_table/blocks/${name}_zinc_ore.json")
            assert table.exists(), "Missing zinc loot table: ${table}"
            assert !table.text.contains('"name": "minecraft:stone"'), "Zinc ore must not drop stone: ${table}"
            assert table.text.contains("create:raw_zinc"), "Zinc ore must drop raw zinc: ${table}"
        }
    }
}
