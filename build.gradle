plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.11-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "8.3.6" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}


subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "com.github.johnrengelman.shadow"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        mappings loom.layered() {

            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_version}")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.mod_id
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {

        flatDir {
            dirs 'mods'
        }

        mavenLocal()

        maven { url "https://maven.parchmentmc.org" }

        exclusiveContent {
            forRepository {
                maven {
                    name = "CurseForge"
                    url = "https://www.cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases"
        }
        maven {
            name = "MehVadJukaar"
            url = "https://registry.somethingcatchy.net/repository/maven-releases/"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Gegy"
                    url = "https://maven.gegy.dev"
                }
            }
            filter {
                includeGroupAndSubgroups("dev.lambdaurora")
                includeGroup("io.github.queerbric")
            }
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }

    java {
        withSourcesJar()
    }
}

tasks.register("validateSpelunkeryData") {
    doLast {
        def resources = file("common/src/main/resources")
        def neoforgeResources = file("neoforge/src/main/resources")
        assert !file("${resources}/data/create/recipes").exists(), "Create recipes must use the singular recipe directory"
        assert file("${resources}/data/create/recipe").exists(), "Create recipe directory is missing"
        assert !file("${resources}/data/spelunkery/overrides").exists(), "Dead dynamic override directory must stay deleted"
        assert file("${neoforgeResources}/data/spelunkery/neoforge/biome_modifier/crevice_carver.json").exists(), "Crevice carver modifier is missing"
        assert fileTree("${resources}/data/minecraft/worldgen/configured_feature").matching { include "ore_*.json" }.isEmpty(), "Global vanilla ore configured overrides must stay deleted"
        assert fileTree("${resources}/data/minecraft/worldgen/placed_feature").matching { include "ore_*.json" }.isEmpty(), "Global vanilla ore placed overrides must stay deleted"
        assert fileTree("${resources}/data/minecraft/loot_table/blocks").matching { include "*ore*.json" }.isEmpty(), "Global vanilla ore loot overrides must stay deleted"
        assert !file("${resources}/data/spelunkery/tags/block/xp_drop_disabled.json").text.contains("minecraft:redstone_ores"), "XP suppression must not include vanilla ore tags"
        assert file("${resources}/data/spelunkery/worldgen/configured_feature/m_ore_coal.json").exists(), "Spelunkery m'ore configured feature is missing"
        assert file("${resources}/data/spelunkery/worldgen/configured_feature/m_ore_diamond_medium.json").exists(), "Spelunkery diamond-medium feature is missing"
        assert file("${resources}/data/spelunkery/worldgen/placed_feature/m_ore_coal_upper.json").exists(), "Spelunkery m'ore placed feature is missing"
        assert file("${resources}/data/spelunkery/tags/worldgen/biome/has_mores.json").exists(), "Spelunkery m'ore biome tag is missing"
        assert !file("${resources}/data/spelunkery/tags/worldgen/biome/has_mores.json").text.contains("minecraft:sulfur_caves"), "Vanilla Backport biomes must stay out of has_mores"

        def addMores = new groovy.json.JsonSlurper().parse(file("${neoforgeResources}/data/spelunkery/neoforge/biome_modifier/add_spelunkery_mores.json"))
        assert addMores.type == "neoforge:add_features"
        assert addMores.step == "underground_ores"
        assert addMores.biomes == "#spelunkery:has_mores"
        assert !addMores.features.contains("spelunkery:m_ore_emerald")
        assert !addMores.features.contains("spelunkery:m_ore_gold_extra")

        def removeMores = new groovy.json.JsonSlurper().parse(file("${neoforgeResources}/data/spelunkery/neoforge/biome_modifier/remove_vanilla_mores.json"))
        assert removeMores.type == "neoforge:remove_features"
        assert removeMores.steps == ["underground_ores"]
        assert removeMores.biomes == "#spelunkery:has_mores"
        assert removeMores.features.contains("minecraft:ore_diamond_medium")

        def removeStone = new groovy.json.JsonSlurper().parse(file("${neoforgeResources}/data/spelunkery/neoforge/biome_modifier/remove_stone_patches.json"))
        assert removeStone.type == "neoforge:remove_features"
        assert removeStone.steps == ["underground_ores"]
        assert removeStone.biomes == "#spelunkery:has_stone_noise"

        ["add_spelunkery_emerald.json", "add_spelunkery_gold_extra.json"].each { name ->
            def extra = new groovy.json.JsonSlurper().parse(file("${neoforgeResources}/data/spelunkery/neoforge/biome_modifier/${name}"))
            assert extra.type == "neoforge:add_features"
            assert extra.step == "underground_ores"
        }

        fileTree("${resources}/data/create/recipe").matching { include "**/*.json" }.each { recipe ->
            def json = new groovy.json.JsonSlurper().parse(recipe)
            if (json.type == "create:crushing") {
                assert json.processing_time != null, "Create crushing recipe is missing processing_time: ${recipe}"
            }
            assert json.results != null, "Create recipe has no results: ${recipe}"
            json.results.each { result ->
                assert result.id instanceof String, "Create recipe result is missing a string id: ${recipe}"
            }
        }

        ["andesite", "diorite", "granite", "tuff"].each { name ->
            def table = file("${resources}/data/spelunkery/loot_table/blocks/${name}_zinc_ore.json")
            assert table.exists(), "Missing zinc loot table: ${table}"
            assert !table.text.contains('"name": "minecraft:stone"'), "Zinc ore must not drop stone: ${table}"
            assert table.text.contains("create:raw_zinc"), "Zinc ore must drop raw zinc: ${table}"
        }
    }
}
